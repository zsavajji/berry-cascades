<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    padding: 28px 18px;
    background: #1b1a26;
    color: #ece9f5;
    font-family: "Slate Pro", Roboto, sans-serif;
  }
  h1 { font-size: 1.5em; font-weight: 300; margin: 0 0 18px; }
  h1 b { color: #b28ceb; font-weight: 600; }
  form { display: flex; gap: 8px; margin-bottom: 26px; }
  input {
    flex: 1; min-width: 0;
    padding: 12px 14px; font-size: 1em;
    border: 1px solid #3d3a52; border-radius: 8px;
    background: #26243a; color: inherit;
  }
  button {
    padding: 12px 16px; font-size: 1em;
    border: 0; border-radius: 8px;
    background: #7a40c4; color: #fff;
  }
  .sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
  .sites a {
    display: block; padding: 14px 6px; text-align: center;
    border-radius: 8px; background: #26243a;
    color: inherit; text-decoration: none; font-size: 0.9em;
  }
  p { color: #8d89a6; font-size: 0.8em; margin-top: 28px; line-height: 1.4; }
</style>
</head>
<body>
  <h1><b>Berry</b> Cascades</h1>
  <form id="search">
    <input id="q" name="q" type="search" placeholder="Search the web" autocomplete="off">
    <button type="submit">Go</button>
  </form>
  <div class="sites">
    <a href="https://en.m.wikipedia.org/">Wikipedia</a>
    <a href="https://news.ycombinator.com/">Hacker News</a>
    <a href="https://www.youtube.com/">YouTube</a>
    <a href="https://web.whatsapp.com/">WhatsApp</a>
    <a href="https://www.openstreetmap.org/">Maps</a>
    <a href="https://text.npr.org/">NPR Text</a>
  </div>
  <p>Type an address or a search in the bar above, or here. Hold a link or an
     image for more, or hold text to select it. Tabs, bookmarks, history and
     settings are in the menu.</p>
<script>
  var engines = {
    duckduckgo: "https://duckduckgo.com/?q=",
    ddglite: "https://html.duckduckgo.com/html/?q=",
    google: "https://www.google.com/search?q=",
    bing: "https://www.bing.com/search?q=",
    wikipedia: "https://en.m.wikipedia.org/w/index.php?search="
  };
  var m = /[?&]engine=(\w+)/.exec(location.search);
  var base = engines[(m && m[1]) || "duckduckgo"] || engines.duckduckgo;
  document.getElementById("search").addEventListener("submit", function (e) {
    e.preventDefault();
    var q = document.getElementById("q").value.trim();
    if (q) location.href = base + encodeURIComponent(q);
  });
</script>
</body>
</html>
